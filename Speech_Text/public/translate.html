<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Translator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    select, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Language Translator</h1>
    <label for="fromLanguage">From:</label>
    <select id="fromLanguage">
      <option value="en">English</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="ur">Urdu</option>
      <!-- Add more languages as needed -->
    </select>
    <label for="toLanguage">To:</label>
    <select id="toLanguage">
      <option value="en">English</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="ur">Urdu</option>
      <!-- Add more languages as needed -->
    </select>
    <label for="inputText">Input Text:</label>
    <textarea id="inputText" rows="4" cols="50"></textarea>
    <button onclick="translateText()">Translate</button>
    <label for="outputText">Output Text:</label>
    <textarea id="outputText" rows="4" cols="50" readonly></textarea>
  </div>

  <script>
    async function translateText() {
      const fromLanguage = document.getElementById('fromLanguage').value;
      const toLanguage = document.getElementById('toLanguage').value;
      const inputText = document.getElementById('inputText').value;

      const response = await fetch('/translate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ fromLanguage, toLanguage, inputText })
      });

      const data = await response.json();

      console.log('transcription: ' + data?.transcription);
      console.log('translatedText: ' + data.translatedText);


      document.getElementById('outputText').value = data.translatedText;
    }
  </script>
</body>
</html>

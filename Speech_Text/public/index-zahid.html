<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Transcription</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input[type="file"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #transcription {
      margin-top: 20px;
      padding: 10px;
      background-color: #e9ecef;
      border-radius: 4px;
      word-wrap: break-word;
    }
    #busy-message {
      display: none;
      text-align: center;
      margin-top: 20px;
      color: #007BFF;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Audio Transcription</h1>
    <form id="upload-form" aria-label="Audio Upload Form">
      <label for="audio-upload">Upload Audio File</label>
      <!-- <input type="file" id="audio-upload" name="audio" accept="audio/*, video/mp4" aria-required="true"> -->
      <input type="file" id="audio-upload" name="audio" accept="audio/wav" aria-required="true">
      <button type="submit">Transcribe Audio</button>
    </form>
    <div id="busy-message">Busy transcribing...</div>
    <div id="transcription" aria-live="polite"></div>
  </div>

  <script>
    const form = document.getElementById('upload-form');
    const busyMessage = document.getElementById('busy-message');
    const transcriptionDiv = document.getElementById('transcription');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      busyMessage.style.display = 'block';
      transcriptionDiv.innerText = '';

      const file = document.querySelector('input[type="file"]').files[0];
      if (!file) {
        busyMessage.style.display = 'none';
        transcriptionDiv.innerText = 'Please upload a file.';
        return;
      }

      // Validate file type
      // if (file.type !== 'audio/*' || file.type !== 'video/mp4') {
      if (file.type !== 'audio/wav') {
        busyMessage.style.display = 'none';
        transcriptionDiv.innerText = 'Please upload a WAV audio file.';
        return;
      }

      const formData = new FormData();
      formData.append('audio', file);

      try {
        const response = await fetch('/upload', {
          method: 'POST',
          body: formData,
        });

        if (!response.ok) {
          throw new Error('Network response was not ok');
        }

        const data = await response.json();
        busyMessage.style.display = 'none';
        transcriptionDiv.innerText = data.transcription;
      } catch (error) {
        busyMessage.style.display = 'none';
        transcriptionDiv.innerText = `Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
